services:
  nextjs:
    build: .
    restart: unless-stopped
    expose:
      - "3005"
    networks:
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`andrewdover.com`) || Host(`www.andrewdover.com`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.services.portfolio.loadbalancer.server.port=3005"
  
  
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "444:444"
  #     # - "443:443"
  #   volumes:
  #     - ./portfolio.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./static:/var/www/portfolio/static:ro
  #   depends_on:
  #     - nextjs
  #   networks:
  #     - public
      
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  
networks:
  public:
    external: true