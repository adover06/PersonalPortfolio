services:
  nextjs:
    build: .
    restart: unless-stopped
    expose:
      - "3005"
    networks:
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`andrewdover.com`) || Host(`www.andrewdover.com`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.services.portfolio.loadbalancer.server.port=3005"
  
  
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "444:444"
  #     # - "443:443"
  #   volumes:
  #     - ./portfolio.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./static:/var/www/portfolio/static:ro
  #   depends_on:
  #     - nextjs
  #   networks:
  #     - public
      
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=andrew.dover@sjsu.edu"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    networks:
      - public
  
networks:
  public:
    external: true